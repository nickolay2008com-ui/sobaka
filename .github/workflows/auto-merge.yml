name: Auto merge trusted PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge trusted pull request after CI
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });

            for (const pr of prs.data) {
              if (pr.state !== 'open' || pr.draft) continue;
              const details = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              const labels = details.data.labels.map((label) => label.name);
              const trusted = details.data.user?.login === owner || labels.includes('automerge');
              const sameRepository = details.data.head.repo?.full_name === `${owner}/${repo}`;
              if (!trusted || !sameRepository) continue;

              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: 'squash',
                sha: details.data.head.sha,
              });
            }
