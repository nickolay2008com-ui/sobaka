name: Unpack verified source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/project.tgz
          test "$(wc -c < /tmp/project.tgz)" -eq 54168
          tar -tzf /tmp/project.tgz >/dev/null

      - name: Replace transport files with readable source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/project.tgz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit source tree to pull request branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unpack verified source tree"
          git push origin "HEAD:${HEAD_BRANCH}"
