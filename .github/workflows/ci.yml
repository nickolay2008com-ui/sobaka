name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          ADMIN_EMAILS: admin@example.com
          ADMIN_SESSION_SECRET: ci-secret-that-is-long-enough-for-build-only
          ANALYTICS_SALT: ci-analytics-salt-that-is-long-enough
      - name: Verify production container
        run: docker build -t partnership-funnel-ci .
